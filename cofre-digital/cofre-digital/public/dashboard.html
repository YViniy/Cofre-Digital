<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cofre Digital - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container dashboard-container">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>Meus Segredos</h2>
                <button onclick="logout()" style="width: auto; background: #444; color: white;">Sair</button>
            </div>
            
            <form id="secret-form" style="margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 20px;">
                <div class="form-group">
                    <label>Título</label>
                    <input type="text" name="title" placeholder="Ex: Senha do Wi-Fi" required>
                </div>
                <div class="form-group">
                    <label>Conteúdo</label>
                    <textarea name="content" rows="3" placeholder="O que você quer guardar?" required></textarea>
                </div>
                <button type="submit">Salvar Segredo</button>
            </form>

            <div id="secrets-list">
                <!-- Segredos serão carregados aqui -->
            </div>
        </div>
    </div>
    <script src="app.js"></script>
    <script>
        // Verificar se está logado ao carregar
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            loadSecrets();
        });
    </script>
</body>
</html>
